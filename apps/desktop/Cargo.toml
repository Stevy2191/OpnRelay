[package]
name = "opnrelay-recorder"
description = "OpnRelay desktop recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
opnrelay-capture = { version = "0.1.0", path = "../../crates/opnrelay-capture" }
opnrelay-client = { version = "0.1.0", path = "../../crates/opnrelay-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = "1.29.3"
webbrowser = "1.2.7"

[lints]
workspace = true
