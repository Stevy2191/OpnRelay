# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opnrelay
          POSTGRES_PASSWORD: opnrelay
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opnrelay"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPNRELAY_TEST_DATABASE_URL: postgres://opnrelay:opnrelay@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Native libraries for the desktop recorder
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxrandr-dev libxtst-dev libxdo-dev libdbus-1-dev libpipewire-0.3-dev libxkbcommon-dev libegl-dev libgbm-dev clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  web:
    name: Web UI (type check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  desktop:
    name: Desktop recorder (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p opnrelay-capture -p opnrelay-client
      - run: cargo build --release --locked -p opnrelay-recorder
      - uses: actions/upload-artifact@v4
        with:
          name: opnrelay-recorder-${{ matrix.os }}
          path: |
            target/release/opnrelay-recorder
            target/release/opnrelay-recorder.exe
          if-no-files-found: ignore

  extension:
    name: Browser extension (type check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: opnrelay-extension
          path: apps/extension/dist/

  supply-chain:
    name: Dependency licences & advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm --dir apps/web audit --prod
      - run: pnpm --dir apps/extension audit --prod

  docker:
    name: Container image
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: opnrelay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
