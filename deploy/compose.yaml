# OpnRelay core services. Pick how it is reached with an override file
# (the installer sets COMPOSE_FILE in .env):
#   compose.caddy.yaml  - Caddy terminates HTTPS on ports 80/443 (recommended)
#   compose.port.yaml   - expose the server on OPNRELAY_HTTP_BIND, for your own
#                         reverse proxy or plain-HTTP testing
name: opnrelay

services:
  server:
    image: ${OPNRELAY_IMAGE:-ghcr.io/stevy2191/opnrelay}:${OPNRELAY_VERSION:-latest}
    restart: unless-stopped
    command: ["serve"]
    environment:
      OPNRELAY_PUBLIC_URL: ${OPNRELAY_PUBLIC_URL:?set OPNRELAY_PUBLIC_URL in .env}
      OPNRELAY_DATABASE_URL_FILE: /run/secrets/database_url
      OPNRELAY_MASTER_KEY_FILE: /run/secrets/master_key
      OPNRELAY_TRUST_PROXY: ${OPNRELAY_TRUST_PROXY:-true}
      OPNRELAY_MAX_UPLOAD_MB: ${OPNRELAY_MAX_UPLOAD_MB:-50}
    secrets: [database_url, master_key]
    volumes:
      - media:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opnrelay
      POSTGRES_USER: opnrelay
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "opnrelay", "-d", "opnrelay"]
      interval: 5s
      timeout: 5s
      retries: 20

secrets:
  master_key:
    file: ./secrets/master_key
  db_password:
    file: ./secrets/db_password
  database_url:
    file: ./secrets/database_url

volumes:
  pgdata: {}
  media: {}
