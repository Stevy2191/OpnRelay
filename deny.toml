# SPDX-License-Identifier: AGPL-3.0-only
# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Reviewed exceptions. Each must state why it is not reachable and be removed
# as soon as upstream allows the fixed version.
ignore = [
    # quick-xml 0.38 via typst -> hayagriva -> citationberg (bibliography/CSL
    # parsing). OpnRelay never uses bibliographies, and the export sandbox
    # (crates/opnrelay-export/src/pdf.rs) only serves data.json and PNGs, so no
    # XML reaches this parser.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml only reachable via typst bibliography parsing, which OpnRelay never invokes" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml only reachable via typst bibliography parsing, which OpnRelay never invokes" },
    # zip 8.x pinned by docx-rs. All advisories concern reading/extracting
    # untrusted archives; docx-rs and OpnRelay only *write* archives.
    { id = "RUSTSEC-2026-0367", reason = "zip extraction only; OpnRelay never extracts archives" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction only; OpnRelay never extracts archives" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction only; OpnRelay never extracts archives" },
    { id = "RUSTSEC-2026-0429", reason = "zip extraction only; OpnRelay never extracts archives" },
    { id = "RUSTSEC-2026-0545", reason = "zip AES reading only; OpnRelay never reads encrypted archives" },
    { id = "RUSTSEC-2026-0546", reason = "zip extraction only; OpnRelay never extracts archives" },
    { id = "RUSTSEC-2026-0547", reason = "zip legacy decompression only; OpnRelay never reads archives" },
    { id = "RUSTSEC-2026-0548", reason = "zip stream extraction only; OpnRelay never extracts archives" },
]

[licenses]
version = 2
# Licences compatible with AGPL-3.0-only distribution.
allow = [
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
